<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>机器人看板</title>
  </head>
  <body>
    <div
      id="startup-error"
      role="alert"
      class="first-error"
      hidden
      style="padding: 1rem; background: var(--bg, #0e1013); color: var(--fg, #e7eaee); font-family: system-ui"
    ></div>
    <script>
      const startupError = document.getElementById('startup-error')
      function showStartupError(reason) {
        startupError.textContent = '无法加载看板。详情：' + String(reason)
        startupError.hidden = false
      }
      window.addEventListener(
        'error',
        (event) => {
          if (event instanceof ErrorEvent) showStartupError(event.message)
          else if (event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement)
            showStartupError('无法加载资源：' + (event.target.src || event.target.href))
        },
        true,
      )
      window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason))
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./board.ts"></script>
  </body>
</html>
